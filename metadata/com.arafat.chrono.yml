AutoName: 'ChronoCraft: Multi-Timer & Stopwatch'
Summary: Privacy-first multi-timer and multi-stopwatch with focus mode
Description: |-
  ChronoCraft is an elegant, privacy-first concurrent multi-timer and multi-stopwatch application designed for productivity, workouts, cooking, studying, and time management.

  Features:
  * Concurrent timers & stopwatches running simultaneously
  * Detailed lap history with split times, fastest/slowest highlights, and clipboard copy
  * Immersive focus mode with keyboard navigation
  * Custom hex color themes and tags
  * 100% offline & local data storage — zero trackers, telemetry, or third-party ads
  * Synthesized Web Audio alarm sounds (no proprietary blobs)



name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for GitHub to auto-generate release notes across tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Strip Local AAPT2 Overrides for CI
        working-directory: android
        run: |
          sed -i '/aapt2/d' gradle.properties || true
          echo "=== gradle.properties after cleanup ==="
          cat gradle.properties

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Build Release APK & AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Collect Release Binaries
        run: |
          mkdir -p release-output
          
          # Extract tag version (e.g., v1.0.19) or fallback to 'manual' for workflow_dispatch
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="latest"; fi

          # Locate and copy the built release APK/AAB
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -f "$APK_FILE" ]; then
            # Copy versioned APK (e.g., ChronoCraft-v1.0.19.apk)
            cp "$APK_FILE" "release-output/ChronoCraft-${VERSION}.apk"
            # Copy static alias APK for static direct download links
            cp "$APK_FILE" "release-output/ChronoCraft-latest.apk"
          fi

          if [ -f "$AAB_FILE" ]; then
            # Copy versioned AAB
            cp "$AAB_FILE" "release-output/ChronoCraft-${VERSION}.aab"
          fi

          ls -la release-output/

      - name: Upload Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true # Auto-generates changelog from commits between tags
          files: release-output/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
